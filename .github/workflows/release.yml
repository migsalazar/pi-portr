name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate release
        shell: bash
        run: |
          set -euo pipefail

          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

          package_version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$package_version"

          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm pack --dry-run

      - name: Publish to npm
        shell: bash
        run: |
          set -euo pipefail

          package="$(node -p "const p = require('./package.json'); p.name + '@' + p.version")"
          published_commit="$(npm view "$package" gitHead 2>/dev/null || true)"
          current_commit="$(git rev-parse HEAD)"

          if [[ -z "$published_commit" ]]; then
            npm publish
          elif [[ "$published_commit" == "$current_commit" ]]; then
            echo "$package was already published from this commit; skipping."
          else
            echo "::error::$package already exists from commit $published_commit."
            exit 1
          fi

      - name: Create GitHub Release
        shell: bash
        run: |
          set -euo pipefail

          release_is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [[ "$release_is_draft" == "false" ]]; then
            echo "GitHub Release $GITHUB_REF_NAME already exists; skipping."
            exit 0
          elif [[ "$release_is_draft" == "true" ]]; then
            echo "::error::GitHub Release $GITHUB_REF_NAME already exists as a draft."
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          notes="$(printf '## Install\n\n```bash\npi install npm:pi-portr@%s\n```' "$version")"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --notes "$notes"
        env:
          GH_TOKEN: ${{ github.token }}
